[project]
name = "dejavu-mcp"
version = "0.1.0"
description = "Claude Code に既視感を与える MCP サーバー。見たものを、名前が付く前から覚えておく"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "pillow>=10",
    "numpy>=1.26",
]

[project.scripts]
dejavu-mcp = "dejavu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dejavu_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/dejavu_mcp/schema.sql" = "dejavu_mcp/schema.sql"
