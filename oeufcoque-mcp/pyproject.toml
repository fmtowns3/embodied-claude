[project]
name = "oeufcoque-mcp"
version = "0.1.0"
description = "Claude Code にマウスを動かす手を与える MCP サーバー。目は持たず、座標を受け取って運び、どこに着いて何を握っているかを返す"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.1,<3"]

[project.scripts]
oeufcoque-mcp = "oeufcoque_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oeufcoque_mcp"]
